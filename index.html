<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4A4C50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="B-CONSULTING"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><title>ED B-CONSULTING – Suivi des apprenants</title>
<style>
:root{--c:#00B2DB;--g:#4A4C50;--bg:#F2F7FA;--card:#fff;--tx:#23262A;--mut:#6B6D72;--bd:#D5DEE4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222427;--tx:#eceff1;--mut:#a3a8ad;--bd:#3a3d41;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222427;--tx:#eceff1;--mut:#a3a8ad;--bd:#3a3d41;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 'Segoe UI',Arial,sans-serif}
header{background:var(--g);color:#fff;padding:14px 16px;border-bottom:4px solid var(--c)}
.hd{display:flex;align-items:center;gap:10px}.hd img{height:52px;width:52px;border-radius:50%;flex:none}.hd img.r{border-radius:12px}.hd div{flex:1;min-width:0}header b{font-size:18px;display:block}header small{color:#bfeaf6}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--c);color:#fff;font-weight:700;cursor:pointer}
button.s{background:transparent;color:var(--c);border:1.5px solid var(--c)}button.d{background:#c0392b}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin-top:4px}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.it{cursor:pointer}.it b{font-size:17px}.it small{color:var(--mut)}
.pill{background:var(--c);color:#fff;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}.tabs button.on{background:var(--c);color:#fff;border-color:var(--c)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left}th{color:var(--mut)}td select{width:64px;margin:0;padding:6px}
.note{font-size:13px;color:var(--mut)}h3{margin:4px 0 10px}
</style></head><body>

<main id="app"></main>
<script>
const K='ed_apprenants_v1';let S=[];try{S=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){S=[]}
const SEED=[];SEED.forEach(x=>{if(!S.some(s=>s.id===x.id))S.push(x)});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let cur=null,tab='fiche',del=false;
const $=s=>document.querySelector(s),esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CR=['Motivation et disponibilité','Compétence de départ','Ressources et faisabilité','Compréhension du client cible',"Clarté de l'offre commerciale",'Capacité pratique et qualité du travail','Prospection et communication','Organisation et suivi'];
const F=[['nom','Nom','t'],['prenom','Prénom(s)','t'],['code','Code apprenant','t'],['tel','Téléphone / WhatsApp','t'],['coach','Coach référent','t'],['entree',"Date d'entrée dans le programme",'d'],['formation','Formation suivie','s',['Infographie','Intelligence artificielle','Excel','Sourcing Chine','Autre']],['temps','Temps disponible par semaine','s',['Moins de 5 h','De 5 à 10 h','Plus de 10 h']],['materiel','Matériel disponible','a'],['domaine',"Domaine principal choisi (n° de l'idée)",'t'],['comp','Compétence complémentaire','t'],['service','Service à vendre','a'],['cible','Clientèle cible','a'],['prix','Prix ou rémunération envisagé','t'],['o7','Objectif à 7 jours','a'],['o15','Objectif à 15 jours','a'],['o30','Objectif à 30 jours','a']];
const P=[['Jours 1 à 7','Choisir une activité, définir une cible et produire un premier exemple de travail.'],['Jours 8 à 14',"Identifier des prospects et présenter l'offre."],['Jours 15 à 21',"Analyser les retours et améliorer l'offre."],['Jours 22 à 30','Évaluer les résultats, les démarches réalisées et les prochaines priorités.']];
const SE=[['date','Date','d'],['objectif','Objectif de la séance','a'],['convenues','Actions convenues','a'],['effectuees','Actions réellement effectuées','a'],['preuves','Preuves ou résultats observés','a'],['difficultes','Difficultés rencontrées','a'],['coach','Commentaires du coach','a'],['niveau','Niveau (0 à 4)','n'],['prochaine','Prochaine action','a'],['rdv','Prochain rendez-vous','d']];
const tot=a=>a.reduce((n,v)=>n+(v===''?0:+v),0),has=a=>a.some(v=>v!==''),
lab=t=>t<=8?'Démarrage':t<=16?'En construction':t<=24?'Opérationnel avec appui':'Autonome',
last=s=>{const x=has(s.sc.f)?s.sc.f:has(s.sc.m)?s.sc.m:has(s.sc.i)?s.sc.i:null;return x?tot(x):null};
function fld(o,k,l,t,opt){const v=o[k];return `<label>${l}`+(t==='a'?`<textarea data-k="${k}" rows="2">${esc(v)}</textarea>`:t==='s'?`<select data-k="${k}"><option value=""></option>${opt.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}</select>`:`<input data-k="${k}" type="${t==='d'?'date':'text'}" value="${esc(v)}">`)+`</label>`}
function neu(){const s={id:Date.now(),sc:{i:Array(8).fill(''),m:Array(8).fill(''),f:Array(8).fill('')},seances:[],plan:P.map(()=>({a:'',r:'',st:'À faire',c:''}))};F.forEach(f=>s[f[0]]='');s.code='ED-'+String(S.length+1).padStart(3,'0');S.push(s);save();cur=s;tab='fiche';del=false;render()}
function open(id){cur=S.find(s=>s.id===id);tab='fiche';del=false;render()}
function back(){cur=null;render()}
function render(){cur?detail():list()}
function list(){$('#app').innerHTML=`<div class="row" style="margin-bottom:12px"><input id="q" placeholder="Rechercher un apprenant…" oninput="draw()" style="margin:0"><button onclick="neu()">+ Nouveau</button></div><div id="lst"></div><p class="note">Cet outil aide à orienter et à suivre chaque apprenant. Il ne garantit ni clients ni revenus. Les données sont enregistrées uniquement sur cet appareil et ce navigateur.</p>`;draw()}
function draw(){const q=($('#q').value||'').toLowerCase(),L=S.filter(s=>(s.nom+' '+s.prenom+' '+s.code+' '+s.coach).toLowerCase().includes(q));$('#lst').innerHTML=L.length?L.map(s=>{const t=last(s);return `<div class="card it" onclick="open(${s.id})"><div class="row"><b>${esc((s.nom+' '+s.prenom).trim()||'Sans nom')}</b>${t===null?'':`<span class="pill">${t}/32</span>`}</div><small>${esc(s.code)}${s.coach?' • Coach : '+esc(s.coach):''}${t===null?'':' • '+lab(t)}</small></div>`}).join(''):'<div class="card note">Aucun apprenant. Appuie sur « + Nouveau » pour commencer.</div>'}
function detail(){const T=[['fiche','Fiche'],['eval','Évaluation'],['seances','Séances'],['plan','Plan 30 jours']];let h=`<div class="row"><button class="s" onclick="back()">← Retour</button><b>${esc((cur.nom+' '+cur.prenom).trim()||'Nouvel apprenant')}</b></div><div class="tabs">${T.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';del=false;render()">${t[1]}</button>`).join('')}</div><div class="card">`;
if(tab==='fiche'){h+=F.map(f=>fld(cur,f[0],f[1],f[2],f[3])).join('')+`<button class="d" onclick="rm()">${del?'Confirmer la suppression':'Supprimer cet apprenant'}</button>`}
else if(tab==='eval'){const M=[['i','Initiale'],['m','Mi-parcours'],['f','Finale']];h+=`<h3>Grille d'évaluation (32 points)</h3><p class="note">Chaque critère est noté de 0 (absent) à 4 (autonome et démontré).</p><div class="w"><table><tr><th>Critère</th>${M.map(m=>`<th>${m[1]}</th>`).join('')}</tr>${CR.map((c,j)=>`<tr><td>${j+1}. ${c}</td>${M.map(m=>`<td><select onchange="sc('${m[0]}',${j},this.value)"><option value=""></option>${[0,1,2,3,4].map(n=>`<option${cur.sc[m[0]][j]===String(n)?' selected':''}>${n}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}<tr><th>TOTAL</th>${M.map(m=>`<th>${tot(cur.sc[m[0]])}/32</th>`).join('')}</tr></table></div>`;const t=last(cur);h+=t===null?'':`<p><b>Lecture indicative : ${lab(t)}</b> (0-8 démarrage, 9-16 en construction, 17-24 opérationnel avec appui, 25-32 autonome). Elle ne remplace pas le jugement du coach.</p>`}
else if(tab==='seances'){h+=`<h3>Nouvelle séance</h3>`+SE.map(f=>f[2]==='n'?`<label>${f[1]}<select id="n_${f[0]}">${[0,1,2,3,4].map(n=>`<option>${n}</option>`).join('')}</select></label>`:`<label>${f[1]}${f[2]==='a'?`<textarea id="n_${f[0]}" rows="2"></textarea>`:`<input id="n_${f[0]}" type="date">`}</label>`).join('')+`<button onclick="addS()">Enregistrer la séance</button></div>`+cur.seances.map((x,j)=>`<div class="card"><div class="row"><b>${esc(x.date||'Sans date')}</b><span class="pill">Niveau ${esc(x.niveau)}</span></div>${SE.filter(f=>f[0]!=='date'&&f[0]!=='niveau'&&x[f[0]]).map(f=>`<p style="margin:6px 0"><span class="note">${f[1]} :</span><br>${esc(x[f[0]])}</p>`).join('')}<button class="s" onclick="cur.seances.splice(${j},1);save();render()">Supprimer</button></div>`).join('');h+='<div>'}
else{h+=P.map((p,j)=>{const x=cur.plan[j];return `<h3>${p[0]}</h3><p class="note">${p[1]}</p><label>Actions prévues<textarea data-p="${j}" data-f="a" rows="2">${esc(x.a)}</textarea></label><label>Résultat obtenu<textarea data-p="${j}" data-f="r" rows="2">${esc(x.r)}</textarea></label><label>Statut<select data-p="${j}" data-f="st">${['À faire','En cours','Terminé'].map(s=>`<option${s===x.st?' selected':''}>${s}</option>`).join('')}</select></label><label>Commentaires du coach<textarea data-p="${j}" data-f="c" rows="2">${esc(x.c)}</textarea></label>`}).join('<hr>')+`<p class="note">Aucune vente ni aucun revenu n'est garanti : l'objectif est d'agir, de tester et d'apprendre.</p>`}
$('#app').innerHTML=h+'</div>'}
function sc(m,j,v){cur.sc[m][j]=v;save();render()}
function rm(){if(!del){del=true;render();return}S=S.filter(s=>s!==cur);save();cur=null;render()}
function addS(){const x={};SE.forEach(f=>x[f[0]]=$('#n_'+f[0]).value);cur.seances.unshift(x);save();render()}
document.addEventListener('input',e=>{const d=e.target.dataset;if(!cur||!d)return;if(d.k){cur[d.k]=e.target.value;save()}else if(d.p!==undefined){cur.plan[+d.p][d.f]=e.target.value;save()}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script></body></html>
